<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Kelola Proyek</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/" class="font-extrabold text-indigo-600">Portofolio</a>
                <span class="text-slate-300">|</span>
                <a href="/dashboard" class="text-sm font-bold text-slate-900">Kelola Proyek</a>
                <a href="/dashboard/cv" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">Kelola CV</a>
            </div>
            <a href="/logout" class="text-xs font-semibold text-red-600 hover:underline">Logout</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10 space-y-8">
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h1 class="text-xl font-extrabold text-slate-900 mb-4">Tambah Proyek Baru</h1>
            <form method="POST" action="/create" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Judul Proyek</label>
                    <input type="text" name="title" required placeholder="Contoh: Curriculum Vitae (CV)"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Tech Stack (pisahkan koma)</label>
                    <input type="text" name="tech_stack" placeholder="html,tailwind css,flask"
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Link Proyek</label>
                    <input type="text" name="project_url" placeholder="/cv atau https://..."
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Deskripsi Singkat</label>
                    <input type="text" name="description" required placeholder="Deskripsi proyek..."
                           class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition">
                        Simpan Proyek
                    </button>
                </div>
            </form>
        </section>
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h2 class="text-lg font-extrabold text-slate-900 mb-4">Proyek Tersimpan ({{ projects|length }})</h2>

            {% if projects %}
            <div class="space-y-4">
                {% for p in projects %}
                <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/60 space-y-3">
                    <form method="POST" action="/update/{{ p.id }}" class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Judul</label>
                            <input type="text" name="title" value="{{ p.title }}" required
                                   class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Tech Stack</label>
                            <input type="text" name="tech_stack" value="{{ p.tech_stack or '' }}"
                                   class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Link</label>
                            <input type="text" name="project_url" value="{{ p.project_url or '' }}"
                                   class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Deskripsi</label>
                            <input type="text" name="description" value="{{ p.description }}" required
                                   class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-sm">
                        </div>
                        <div class="md:col-span-4 flex items-center justify-end gap-2 pt-1">
                            <button type="submit" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700">
                                Update
                            </button>
                    </form>
                            <form method="POST" action="/delete/{{ p.id }}" onsubmit="return confirm('Hapus proyek ini?');">
                                <button type="submit" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white hover:bg-red-700">
                                    Hapus
                                </button>
                            </form>
                        </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p class="text-sm text-slate-500">Belum ada data proyek.</p>
            {% endif %}
        </section>
    </main>

</body>
</html>
