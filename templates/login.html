<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="mb-6 text-center">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Area Admin</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Masuk Dashboard</h1>
            <p class="text-xs text-slate-500 mt-1">Masukkan password admin untuk mengelola portofolio & CV.</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input id="password" name="password" type="password" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition">
                Masuk
            </button>
        </form>

        <div class="mt-5 p-3 rounded-xl bg-indigo-50 border border-indigo-100 text-xs text-indigo-700 text-center">
            <p class="font-semibold">Akun Demo Penilaian:</p>
            <p class="mt-0.5">Password: <code class="bg-white px-1.5 py-0.5 rounded font-bold">admin123</code></p>
        </div>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs font-semibold text-slate-500 hover:text-indigo-600">← Kembali ke Beranda</a>
        </div>
    </div>

</body>
</html>
